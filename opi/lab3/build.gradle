tasks.register('compileMixed') {
    group = 'lab4-задания'
    description = 'Компилирует часть классов одним javac, часть другим (-PjdkA=... -PjdkB=...)'

    doLast {
        def javacA = (findProperty('jdkA') ?: 'javac').toString()
        def javacB = (findProperty('jdkB') ?: 'javac').toString()
        def logDir = file("${buildDir}/compile-logs")
        logDir.mkdirs()

        def classpath = backendClasspath.files.join(File.pathSeparator)

        def compileWith = { String javac, List<String> sources, String outName, String extraCp, String logName ->
            def out = file("${buildDir}/${outName}")
            out.deleteDir()
            out.mkdirs()

            def cp = extraCp ? "${classpath}${File.pathSeparator}${extraCp}" : classpath
            def command = ([javac, '-encoding', 'UTF-8', '-d', out.absolutePath, '-cp', cp] + sources)*.toString()

            def process = new ProcessBuilder(command).redirectErrorStream(true).start()
            def output = process.inputStream.text
            def code = process.waitFor()

            new File(logDir, logName).text = "Компилятор: ${javac}\nФайлов: ${sources.size()}\nКод завершения: ${code}\n\n${output}"

            def produced = fileTree(out).matching { include '**/*.class' }.files.size()
            println "${logName}: код ${code}, классов ${produced}, лог ${logName}"
            return out.absolutePath
        }

        def patternB = (findProperty('splitB') ?: '**/dto/*.java').toString()
        def sources = fileTree(srcDir).matching { include '**/*.java' }.files*.path.sort()
        def sourcesB = fileTree(srcDir).matching { include patternB }.files*.path.sort()

        println "Компилятор A: ${javacA} (все ${sources.size()} файлов)"
        def outA = compileWith(javacA, sources, 'classes-a', null, 'javac-a.log')

        println "Компилятор B: ${javacB} (${sourcesB.size()} файлов по маске ${patternB})"
        compileWith(javacB, sourcesB, 'classes-b', outA, 'javac-b.log')

        println "Логи компиляции: ${logDir.absolutePath}"
        println "Проверить версии: ./gradlew classVersion -Pdir=build/classes-a"
        println "                  ./gradlew classVersion -Pdir=build/classes-b"
    }
}


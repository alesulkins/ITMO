evaluationDependsOn(':backend')
// из gradle.properties
def srcDir = file(rootProject.property('backendSrcDir'))
def classDir = file(rootProject.property('buildClassesDir'))
def frontendDir = file(rootProject.property('frontendDir'))
def functionalTestsDir = file(rootProject.property('functionalTestsDir'))
def composeTestFile = rootProject.property('composeTestFile').toString()
def functionalTestsService = rootProject.property('functionalTestsService').toString()
def historyDockerImage = rootProject.property('historyDockerImage').toString()
def historyDiffFile = file(rootProject.property('historyDiffFile'))

//  коннект с project, вычисляем на этапе конфигурации - была траббл из-за того, что в doLast не видны project и rootProject
def projectRoot = rootDir
def backendClasspath = files(project(':backend').configurations.compileClasspath)
def useDockerHistory = (findProperty('dockerHistory') == 'true')
def grepFilter = findProperty('grep')?.toString()

// функция принисмающая комманду как список строк
def runCommand = { List<String> command, File workingDir ->
    def process = new ProcessBuilder(command) // класс запуска внешних программ в джаве или груви
        .directory(workingDir) 
        .redirectErrorStream(true)
        .start()
    process.inputStream.eachLine { line -> println line }
    return process.waitFor() //ждем код завершения (0-успех)
}

tasks.register('filter_func-tests') {
    group = 'lab4'
    description = 'Filters functional tests by Playwright tags'

    doLast {
        def tagsProperty = findProperty('tags')
        def tags = []

        if (tagsProperty != null) {
            def tagsString = tagsProperty.toString()
            def parts = tagsString.split(',')

            for (part in parts) {
                def tag = part.trim()

                if (!tag.isEmpty()) {
                    tags.add(tag)
                }
            }
        }

        def command = ['npx','playwright', 'test']

        if (tags.isEmpty()) {
            println "No tags specified. Running all functional tests."
        } else {
            def grepParts = []

            for (tag in tags) {
                if (tag.startsWith('@')) {
                    grepParts.add(tag)
                } else {
                    grepParts.add('@' + tag)
                }
            }

            def grepPattern = grepParts.join('|')
            println "Running functional tests with tags: ${grepPattern}"

            command.add('--grep')
            command.add(grepPattern)
        }
        def exitCode = runCommand(command, functionalTestsDir)

        if (exitCode != 0) {
            throw new GradleException("Functional tests failed")
        }
        println "Functional tests completed successfully"
    }
}

tasks.register('compile') {
    group = 'lab4'
    description = 'Compiles Java code'

    doLast {
        def javaFiles = fileTree(srcDir).matching { include '**/*.java' }.files*.path
        if (javaFiles.isEmpty()) {
            throw new GradleException("No Java files found in ${srcDir}")
        }

        classDir.mkdirs()

        def classpath = backendClasspath.files.join(File.pathSeparator)
        def command = ['javac', '-encoding', 'UTF-8', '-d', classDir.absolutePath]
        if (classpath) {
            command += ['-cp', classpath]
        }
        command += javaFiles

        println "javac: compiling ${javaFiles.size()} files..."

        if (runCommand(command, projectRoot) != 0) {
            throw new GradleException("Compilation failed")
        }
        println "Compilation successful"
    }
}

tasks.named('build') {
    group  = 'lab4'
    description = 'Compilation and packaging into JAR'

    dependsOn 'compile', ':backend:bootJar'
}

tasks.named('clean') {
    group       = 'lab4'
    description = 'Cleans compiled classes and tmp files'

    delete project(':backend').layout.buildDirectory
    delete file("${frontendDir}/${rootProject.property('frontendBuildDir')}")
    delete file("${frontendDir}/${rootProject.property('frontendNodeCacheDir')}")
    delete file("${functionalTestsDir}/${rootProject.property('functionalTestsResultsDir')}")
    delete file("${functionalTestsDir}/${rootProject.property('functionalTestsReportDir')}")
}

tasks.register('test') {
    group       = 'lab4'
    description = 'Runs unit tests'

    dependsOn 'build', ':backend:test'
}

// ф тесты в docker-поднимают бд, бэк, фронт и Playwright
tasks.register('func-tests') {
    group = 'lab4'
    description = 'Runs functional tests in Docker'
    dependsOn 'build'

    doLast {
        def command

        if (grepFilter) {
            command = ['docker','compose','-f',composeTestFile,'run', functionalTestsService,'npx','playwright','test', '--grep',grepFilter]

            println "Running functional tests in Docker, filter: ${grepFilter}"
        } else {
            command = ['docker','compose','-f', composeTestFile,'up', '--build', '--exit-code-from', functionalTestsService, functionalTestsService ]

            println "Running functional tests in Docker..."
        }

        def exitCode = runCommand(command, projectRoot)
        runCommand(['docker', 'compose', '-f', composeTestFile, 'down', '--remove-orphans'], projectRoot)

        if (exitCode != 0) {
            throw new GradleException("Functional tests failed")
        }

        println "Functional tests completed successfully"
    }
}

tasks.register('func-tests-local') {
    group = 'lab4'
    description = 'Runs functional tests on the host (application must be running)'

    dependsOn 'build'

    doLast {
        // зависимости и браузер только при первом запуске
        def nodeModules = new File(functionalTestsDir, rootProject.property('functionalTestsNodeModulesDir').toString())
        if (!nodeModules.exists()) {
            println "Installing Playwright (first run, may take a few minutes)..."
            if (runCommand(['npm', 'install'], functionalTestsDir) != 0) {
                throw new GradleException("npm install failed")
            }
            if (runCommand(['npx', 'playwright', 'install', 'chromium'], functionalTestsDir) != 0) {
                throw new GradleException("Playwright browser installation failed")
            }
        }

        def command = ['npx', 'playwright', 'test']
        if (grepFilter) {
            command += ['--grep', grepFilter]
        }

        println grepFilter
            ? "Running functional tests on the host, filter: ${grepFilter}"
            : 'Running functional tests on the host (application must be running locally)...'

        if (runCommand(command, functionalTestsDir) != 0) {
            throw new GradleException("Functional tests failed")
        }
        println "Functional tests completed successfully"
    }
}

tasks.register('xml') {
    group       = 'lab4'
    description = 'Validation of xml-files'

    doLast {
        def xmlFiles = fileTree(projectRoot) {
            include '**/*.xml'
            exclude '**/build/**', '**/node_modules/**', '**/.gradle/**', '**/.idea/**'
        }.files

        if (xmlFiles.isEmpty()) {
            println "No XML files found for validation"
            return
        }
        // билдер - хмл парсер проверяет корректность хмл
        def builder = javax.xml.parsers.DocumentBuilderFactory.newInstance().newDocumentBuilder()
        def errors = []

        xmlFiles.each { xmlFile ->
            println "Validating ${xmlFile.name}"
            try {
                builder.parse(xmlFile)
            } catch (Exception e) {
                errors << "Error in ${xmlFile.path}: ${e.message}"
            }
        }

        if (errors) {
            println "XML validation completed with errors:"
            errors.each { println it }
            throw new GradleException("XML validation failed with ${errors.size()} error(s)")
        }
        println "XML validation successful: all ${xmlFiles.size()} file(s) are well-formed"
    }
}

tasks.register('history') {
    group       = 'lab4'
    description = 'Finds the last working git revision and writes diff file'

    doLast {
        // git +  возврат вывод
        def git = { List<String> command ->
            def process = new ProcessBuilder(command) // новый внешний процесс исполняющий кмд
                .directory(projectRoot)
                .redirectErrorStream(true)
                .start()
            def output = process.inputStream.text.trim() //от пустых строк
            return [code: process.waitFor(), text: output]
        }

        // попытка собрать текущую ревизию: локально или внутри Docker-контейнера
        def compiles = {
            def command = ['./gradlew', 'clean', 'compile', '--no-daemon', '--quiet'] // по дефолту лок
            if (useDockerHistory) { // внутри докера
                command = ['docker', 'run', '--rm',
                           '-v', "${projectRoot.absolutePath}:/workspace".toString(),
                           '-w', '/workspace',
                           historyDockerImage] + command
            }
            return git(command).code == 0
        }

        if (git(['git', 'rev-parse', '--is-inside-work-tree']).code != 0) {
            throw new GradleException('history target works only inside git repository')
        }
        if (git(['git', 'status', '--porcelain']).text) {
            throw new GradleException('Commit or stash changes before running history')
        }

        // куда вернуться после перебора ревизий
        def originalBranch = git(['git', 'branch', '--show-current']).text
        def originalRef = originalBranch ?: git(['git', 'rev-parse', 'HEAD']).text

        println 'Checking current revision...'
        if (compiles()) {
            println 'Current revision compiles successfully'
            return
        }

        def commits = git(['git', 'log', '--first-parent', '--format=%H']).text.readLines()

        String lastWorking = null
        String firstFailing = commits[0]

        try {
            for (int i = 1; i < commits.size(); i++) {
                println "Checking ${commits[i].take(7)}..."

                if (git(['git', 'checkout', '--quiet', commits[i]]).code != 0) {
                    throw new GradleException("Cannot checkout ${commits[i].take(7)}")
                }
                if (compiles()) {
                    lastWorking = commits[i]
                    firstFailing = commits[i - 1]
                    break
                }
            }
        } finally {
            // возвращаем репозиторий в исходное состояние
            if (git(['git', 'checkout', '--quiet', originalRef]).code != 0) {
                throw new GradleException("Cannot restore original Git position: ${originalRef}")
            }
        }

        if (lastWorking == null) {
            println 'No working revision found, including the first revision'
            return
        }

        historyDiffFile.parentFile.mkdirs()
        historyDiffFile.text = git(['git', 'diff', lastWorking, firstFailing]).text

        println "Last working revision: ${lastWorking.take(7)}"
        println "First failing revision: ${firstFailing.take(7)}"
        println "Diff saved to: ${historyDiffFile.absolutePath}"
    }
}





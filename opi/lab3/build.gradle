tasks.register('classVersion') {
    group = 'lab4-задания'
    description = 'Показывает, какой версией Java скомпилированы классы'

    doLast {
        def versions = [52: 'Java 8', 55: 'Java 11', 61: 'Java 17', 65: 'Java 21', 66: 'Java 22', 67: 'Java 23', 68: 'Java 24', 69: 'Java 25']
        def target = findProperty('dir') ? file(findProperty('dir')) : classDir
        def classFiles = fileTree(target).matching { include '**/*.class' }.files

        if (classFiles.isEmpty()) {
            throw new GradleException("Классы не найдены в ${target}. Сначала ./gradlew compile")
        }

        println "Каталог: ${target}"

        classFiles.take(5).each { f ->
            def header = new byte[8]
            f.withInputStream { it.read(header) }
            def major = ((header[6] & 0xFF) << 8) | (header[7] & 0xFF)
            println "${f.name}: major=$major (${versions[major] ?: 'неизвестно'})"
        }
        println "Всего классов: ${classFiles.size()}"
    }
}

tasks.register('checkCache') {
    group = 'lab4-задания'
    description = 'Проверяет кэш зависимостей Gradle и готовность к сборке без интернета'

    doLast {
        def cache = file("${System.getProperty('user.home')}/.gradle/caches/modules-2/files-2.1")

        if (!cache.exists()) {
            println 'Кэш пуст: зависимости не скачаны, нужен интернет'
            return
        }

        def cached = fileTree(cache).matching { include '**/*.jar' }.files
        println "Кэш: ${cache.absolutePath}"
        println "Артефактов в кэше: ${cached.size()}"

        def needed = backendClasspath.files
        def missing = needed.findAll { !it.exists() }
        println "Нужно для сборки: ${needed.size()}"

        if (missing) {
            println "Отсутствует локально: ${missing.size()} - потребуется интернет"
        } else {
            println 'Все зависимости на диске: сборка возможна без интернета (./gradlew build --offline)'
        }
    }
}

